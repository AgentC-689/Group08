<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Check-In - Student Attendance System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body onload="initLayout('checkin'); loadOpenStudentSessions();">
    <!-- Part 4 (Member 4): Student Self Check-In with Session Code & GPS Verification (FR16, UC09) -->
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <h2 class="page-title">Student Self Check-In</h2>
            <div class="card" style="max-width:480px;">
                <form onsubmit="submitStudentCheckIn(event)">
                    <div style="margin-bottom:12px;">
                        <label>Open Attendance Session</label>
                        <select id="studentSessionSelect" required></select>
                    </div>
                    <div style="margin-bottom:16px;">
                        <label>Session Code</label>
                        <input id="checkInCode" placeholder="Enter session code (e.g. WEB123)" required>
                    </div>
                    <button type="submit" class="btn btn-success" style="width:100%;">Check In (Verify Code & GPS)</button>
                </form>
                <div id="checkInStatus" class="alert-msg" style="display:none;margin-top:14px;"></div>
            </div>
        </main>
    </div>
    <script src="/js/apiClient.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/attendance.js"></script>
</body>
</html>
