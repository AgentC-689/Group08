<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Student Attendance System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body onload="initLayout('change_password');">
    <!-- Part 1 (Member 1): Self-Service Password Change (FR02) -->
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <h2 class="page-title">Change Password</h2>
            <div class="card" style="max-width:460px;">
                <form onsubmit="handleChangePassword(event)">
                    <div style="margin-bottom:12px;">
                        <label>Current Password</label>
                        <input id="oldPassword" type="password" placeholder="Enter current password" required>
                    </div>
                    <div style="margin-bottom:12px;">
                        <label>New Password (min 6 characters)</label>
                        <input id="newPassword" type="password" minlength="6" placeholder="Enter new password" required>
                    </div>
                    <div style="margin-bottom:16px;">
                        <label>Confirm New Password</label>
                        <input id="confirmPassword" type="password" minlength="6" placeholder="Confirm new password" required>
                    </div>
                    <button type="submit" class="btn" style="width:100%;">Update Password</button>
                </form>
                <div id="pwdMsg" class="alert-msg" style="display:none;margin-top:14px;"></div>
            </div>
        </main>
    </div>
    <script src="/js/apiClient.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
