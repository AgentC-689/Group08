<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses - Student Attendance System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body onload="initLayout('courses'); loadCourses();">
    <!-- Part 3 (Member 3): Course Catalog Management (FR06) -->
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <h2 class="page-title">Manage Courses</h2>
            <div class="card">
                <form onsubmit="createCourse(event)">
                    <div class="form-grid">
                        <input id="crsCode" placeholder="Course Code (e.g. CS305)" required>
                        <input id="crsName" placeholder="Course Name" required>
                        <input id="crsCredits" type="number" value="3" min="1" required>
                        <button type="submit" class="btn">Add Course</button>
                    </div>
                </form>
                <table>
                    <thead><tr><th>Course Code</th><th>Course Name</th><th>Credits</th></tr></thead>
                    <tbody id="coursesBody"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="/js/apiClient.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/courseLecturer.js"></script>
</body>
</html>
