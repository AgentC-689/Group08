<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Accounts - Student Attendance System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body onload="initLayout('accounts'); loadAccounts();">
    <!-- Part 1 (Member 1): Administrator Account Management (FR03) -->
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <h2 class="page-title">Manage Accounts</h2>
            <div class="card">
                <form onsubmit="createAccount(event)">
                    <div class="form-grid">
                        <input id="accUsername" placeholder="Username" required>
                        <input id="accPassword" type="password" placeholder="Initial Password" required>
                        <select id="accRole">
                            <option value="Student">Student</option>
                            <option value="Lecturer">Lecturer</option>
                            <option value="Administrator">Administrator</option>
                        </select>
                        <button type="submit" class="btn">Create Account</button>
                    </div>
                </form>
                <table>
                    <thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="accountsBody"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="/js/apiClient.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
