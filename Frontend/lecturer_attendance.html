<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management - Student Attendance System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body onload="initLayout('attendance'); loadLecturerSessions();">
    <!-- Part 4 (Member 4): Create Session, Manual Attendance & Audit Edit matching Figma Page 3 -->
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <h2 class="page-title">Attendance Management</h2>
            <div class="card">
                <h3>Create New Attendance Session (FR15)</h3>
                <form onsubmit="createSession(event)" style="margin-top:12px;">
                    <div class="form-grid">
                        <input id="sessClassId" type="number" value="1" placeholder="Class ID" required>
                        <input id="sessDate" type="date" required>
                        <input id="sessSlot" value="Slot 2" placeholder="Time Slot" required>
                        <input id="sessStart" type="time" value="07:00" required>
                        <input id="sessEnd" type="time" value="07:30" required>
                        <input id="sessLat" type="number" step="any" value="10.8037" placeholder="Class Latitude">
                        <input id="sessLng" type="number" step="any" value="106.7168" placeholder="Class Longitude">
                        <input id="sessDist" type="number" value="100" placeholder="Allowed Radius (m)">
                    </div>
                    <label style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;">
                        <input id="sessRequireGps" type="checkbox" style="width:auto;" checked> Require check-in inside class area (GPS)
                    </label>
                    <button type="submit" class="btn">Create Session & Generate Code</button>
                </form>
            </div>
            <div class="card">
                <div class="form-grid">
                    <select id="sessionSelect" onchange="loadSessionRoster()"></select>
                    <button type="button" class="btn btn-danger" onclick="closeSelectedSession()">Close Session & Mark Unchecked Absent</button>
                </div>
                <table>
                    <thead><tr><th>Student ID</th><th>Student Name</th><th>GPS Check</th><th>Status</th><th>Edit Reason</th><th>Mark / Edit</th></tr></thead>
                    <tbody id="rosterBody"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="/js/apiClient.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/attendance.js"></script>
</body>
</html>
