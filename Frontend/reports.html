<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Report - Student Attendance System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body onload="initLayout('reports'); loadReport();">
    <!-- Part 5 (Member 5): Statistics, Absence Warning (>20%) & Export matching Figma Page 4 -->
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <h2 class="page-title">Attendance Report</h2>
            <div class="card">
                <div class="form-grid">
                    <select id="reportClassId" onchange="loadReport()">
                        <option value="">All Classes</option>
                        <option value="1">CNTT01</option>
                        <option value="2">CNTT02</option>
                    </select>
                    <button class="btn btn-success" onclick="exportCsvReport()">Export Excel / CSV</button>
                    <button class="btn btn-secondary" onclick="window.print()">Export / Print PDF</button>
                </div>
                <p id="overallSummary" style="font-weight:700;margin:10px 0;color:#1e3a8a;"></p>
                <table>
                    <thead><tr><th>Student ID</th><th>Student Name</th><th>Sessions</th><th>Present</th><th>Absent</th><th>Late</th><th>Attendance Rate</th><th>Warning Status</th></tr></thead>
                    <tbody id="reportBody"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="/js/apiClient.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/reports.js"></script>
</body>
</html>
