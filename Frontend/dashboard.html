<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Attendance System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body onload="initLayout('dashboard'); loadDashboard();">
    <!-- Part 5 (Member 5): Main Dashboard matching Figma Wireframe Page 2 -->
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <h2 class="page-title">Welcome to Student Attendance System</h2>
            <div class="kpi-grid">
                <div class="kpi-card"><div class="kpi-label">Total Students</div><div id="kpiStudents" class="kpi-value">-</div></div>
                <div class="kpi-card"><div class="kpi-label">Total Classes</div><div id="kpiClasses" class="kpi-value">-</div></div>
                <div class="kpi-card"><div class="kpi-label">Total Courses</div><div id="kpiCourses" class="kpi-value">-</div></div>
                <div class="kpi-card"><div class="kpi-label">Attendance Rate</div><div id="kpiRate" class="kpi-value">-</div></div>
            </div>
            <div class="card">
                <h3>Recent Attendance</h3>
                <table>
                    <thead><tr><th>Student ID</th><th>Student Name</th><th>Class</th><th>Status</th></tr></thead>
                    <tbody id="recentBody"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="/js/apiClient.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/reports.js"></script>
</body>
</html>
