<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - Student Attendance System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body onload="initLayout('students'); loadStudents();">
    <!-- Part 2 (Member 2): Student Management & CSV Batch Import (FR04, FR05) -->
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <h2 class="page-title">Manage Students</h2>
            <div class="card">
                <form onsubmit="createStudent(event)">
                    <div class="form-grid">
                        <input id="stCode" placeholder="Student ID (e.g. SV004)" required>
                        <input id="stName" placeholder="Full Name" required>
                        <input id="stEmail" type="email" placeholder="Email" required>
                        <input id="stClassId" type="number" value="1" placeholder="Class ID" required>
                        <button type="submit" class="btn">Add Student</button>
                    </div>
                </form>
                <div class="form-grid">
                    <input id="searchQuery" placeholder="Search by ID, name, or email..." oninput="loadStudents()">
                    <input id="csvFile" type="file" accept=".csv">
                    <button type="button" class="btn btn-success" onclick="importCsvStudents()">Import CSV</button>
                </div>
                <table>
                    <thead><tr><th>Student ID</th><th>Full Name</th><th>Email</th><th>Class</th><th>Action</th></tr></thead>
                    <tbody id="studentsBody"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="/js/apiClient.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/studentClass.js"></script>
</body>
</html>
