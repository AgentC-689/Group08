<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Attendance System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Part 1 (Member 1): Login Page matching Figma Wireframe Page 1 -->
    <div class="login-wrapper">
        <form class="login-box" onsubmit="handleLoginSubmit(event)">
            <h2>Student Attendance System</h2>
            <p class="subtitle">Welcome Back</p>
            <div id="loginMsg" class="alert-msg" style="display:none;"></div>
            <div style="margin-bottom:12px;">
                <label>Username</label>
                <input id="username" type="text" placeholder="Enter your username (admin / gv001 / SV001)" required>
            </div>
            <div style="margin-bottom:18px;">
                <label>Password</label>
                <input id="password" type="password" placeholder="Enter your password (123456)" required>
            </div>
            <button type="submit" class="btn" style="width:100%;">LOGIN</button>
        </form>
    </div>
    <script src="/js/apiClient.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
