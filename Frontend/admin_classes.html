<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Classes - Student Attendance System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body onload="initLayout('classes'); loadClasses();">
    <!-- Part 2 (Member 2): Class Management & Lecturer/Room Conflict Check (FR07, UC04) -->
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main-content">
            <h2 class="page-title">Manage Classes</h2>
            <div class="card">
                <form onsubmit="createClass(event)">
                    <div class="form-grid">
                        <input id="clsCode" placeholder="Class Code (e.g. CNTT03)" required>
                        <input id="clsName" placeholder="Class Name" required>
                        <input id="clsCourseId" type="number" value="1" placeholder="Course ID" required>
                        <input id="clsLecturerId" type="number" value="1" placeholder="Lecturer ID" required>
                        <input id="clsSchedule" placeholder="Schedule (e.g. Fri 07:00-09:30)" required>
                        <input id="clsRoom" placeholder="Room (e.g. C302)" required>
                        <button type="submit" class="btn">Create Class</button>
                    </div>
                </form>
                <table>
                    <thead><tr><th>Code</th><th>Class Name</th><th>Course</th><th>Lecturer</th><th>Schedule</th><th>Room</th></tr></thead>
                    <tbody id="classesBody"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="/js/apiClient.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/studentClass.js"></script>
</body>
</html>
